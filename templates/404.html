{% extends 'base.html' %}
{% block title %}404 — 页面不存在 · {{ site.name }}{% endblock %}

{% block content %}
<section class="section" style="padding:120px 0">
  <div class="container center">
    <div class="err-code">404</div>
    <h1>页面不存在或已被移除</h1>
    <p class="muted">你访问的地址 {{ request.path }} 无法找到。</p>
    <div class="hero-actions" style="justify-content:center">
      <a class="btn btn-primary" href="{{ url_for('index') }}">回到首页</a>
      <a class="btn btn-ghost" href="{{ url_for('services') }}">查看业务线</a>
    </div>
  </div>
</section>
{% endblock %}
